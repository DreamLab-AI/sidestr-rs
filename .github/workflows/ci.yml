name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The reference engine the oracle suites drive (sidestr/spec SPEC 0.0.4,
  # @sidestr/spec 0.0.6, and the two checkouts siding loads). Bump together,
  # and say so in the changelogs.
  SIDESTR_SPEC_REF: fa86dac83d47b8f70195132e91e9dc083e1d9228
  SCHEMA_REF: b8cbf6337c7450fe14ddc5bce00c7280059aab5d
  BLAKETESTNODE_REF: d2764d21fe1f8c29b1979e49eb8287a72dd2347e

jobs:
  gate:
    name: fmt, clippy, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The ported siding suites, the sealed fixtures and the audit
      # regressions. The oracle halves report themselves skipped here; the
      # `oracle` job runs them against the reference.
      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Test (default features)
        run: cargo test --workspace

      # Every published crate ships full rustdoc.
      - name: Docs (default features)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs (all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs (no default features)
        run: cargo doc --workspace --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

      # sidestr-core on its own, without std: built beside the other crates,
      # Cargo unifies features and their default dependency on sidestr-core
      # turns std back on, which is how a std-only error variant in the
      # mirror reader went unnoticed until 0.3.2.
      - name: sidestr-core alone, no std (native and wasm32)
        run: |
          cargo check -p sidestr-core --no-default-features
          cargo check -p sidestr-core --no-default-features --target wasm32-unknown-unknown

      # The pure halves a browser wallet links (the forum's): secp256k1's C
      # builds with the runner's clang for wasm32. sidestr-evm is not among
      # them: it needs no further C, but k256 draws in getrandom 0.2, which
      # refuses wasm32-unknown-unknown until something selects its `js`
      # backend, and a library must leave that choice to the application
      # that links it.
      - name: wasm32 (the libraries without the agent's CLI)
        run: cargo build --target wasm32-unknown-unknown -p sidestr-core -p sidestr-wallet -p sidestr-nostr -p sidestr-agent --no-default-features

  oracle:
    name: against the reference (siding at fa86dac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out sidestr/spec (siding)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sidestr/spec
          ref: ${{ env.SIDESTR_SPEC_REF }}
          path: reference/spec

      - name: Check out bitcoin-desktop/schema
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bitcoin-desktop/schema
          ref: ${{ env.SCHEMA_REF }}
          path: reference/schema

      - name: Check out bitcoin-blake/blaketestnode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bitcoin-blake/blaketestnode
          ref: ${{ env.BLAKETESTNODE_REF }}
          path: reference/blaketestnode

      # siding wants Node 22 or later (WebSocket built in); so does the
      # sidestr-evm fixture generator's ethereumjs.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # The reference's own tests of the changes ported here, as a sanity check
      # of the checkouts: 0.0.3 (txsign), 0.0.4 (the peg tag, kind 23503).
      - name: Reference txsign, announce and parentrelay tests
        run: |
          node reference/spec/siding/test/txsign-test.mjs
          node reference/spec/siding/test/announce-test.mjs
          node reference/spec/siding/test/parentrelay-test.mjs
        env:
          SCHEMA: ${{ github.workspace }}/reference/schema
          BLAKETESTNODE: ${{ github.workspace }}/reference/blaketestnode

      # sidestr-evm's fixtures, written again by its ethereumjs oracle at the
      # versions siding pins, cross-checked block by block against the
      # checked-out evm.mjs (the generator holds it to its SHA-256), must be
      # the ones committed. Outside the checkout, so node_modules never
      # lands in the tree.
      - name: sidestr-evm fixtures (regenerated, no drift)
        run: |
          scratch="$RUNNER_TEMP/evm-oracle"
          mkdir -p "$scratch"
          cp sidestr-evm/tests/oracle/{oracle.mjs,package.json,package-lock.json} "$scratch"
          cp reference/spec/siding/lib/overlays/evm.mjs "$scratch/evm.reference.mjs"
          (cd "$scratch" && npm ci --no-audit --no-fund && node oracle.mjs "$GITHUB_WORKSPACE/sidestr-evm/tests/fixtures")
          git diff --exit-code -- sidestr-evm/tests/fixtures
          test -z "$(git status --porcelain -- sidestr-evm/tests/fixtures)"

      # Genesis and blocks both ways, the records, the wallet's spends and
      # burns through Siding.submit(), its EVM deposits byte for byte with
      # siding's buildSpend, the txsign parity (byte-identical witnesses on
      # both families), and the mixed Rust/JS signing rounds.
      - name: Oracle and interop suites
        run: cargo test --workspace --all-features
        env:
          SIDESTR_SIDING: ${{ github.workspace }}/reference/spec/siding
          SCHEMA: ${{ github.workspace }}/reference/schema
          BLAKETESTNODE: ${{ github.workspace }}/reference/blaketestnode
