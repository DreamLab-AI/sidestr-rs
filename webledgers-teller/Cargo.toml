[package]
name = "webledgers-teller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "A teller for Web Ledgers on txbt4: did:nostr accounts, a ledger identified by the hash of its genesis, one taproot deposit address per account by additive tweak of the operator's key, signed join/withdraw/transfer requests (kind 3700) applied once, and payouts signed per input with each deposit's derived secret. Pure, no I/O. A port of solidpayorg/teller by Melvin Carvalho."
readme = "README.md"
documentation = "https://docs.rs/webledgers-teller"
keywords = ["bitcoin", "nostr", "web-ledgers", "taproot", "did-nostr"]
categories = ["cryptography::cryptocurrencies"]
publish = true
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[dependencies]
# Unified sighash, the taproot key-path verifier, segwit addresses and the
# secp256k1 context; the Nostr event and its BIP-340 verification.
sidestr-core = { path = "../sidestr-core", version = "0.4.1" }
sidestr-nostr = { path = "../sidestr-nostr", version = "0.5.0" }
bitcoin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
