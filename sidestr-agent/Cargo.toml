[package]
name = "sidestr-agent"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Rust port of Melvin Carvalho's sidestr sidechains, AGPL-3.0-only: the economic engine for did:nostr agents. A did:nostr key is a sidechain wallet. The agent wallet: balance, npub to chain address, spends and peg-out burns as kind-23500 events signed with the agent's own key, and a peg-in plan for a parent wallet to pay."
readme = "README.md"
documentation = "https://docs.rs/sidestr-agent"
keywords = ["sidestr", "nostr", "sidechain", "wallet", "did-nostr"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
publish = true
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "sidestr-agent"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `sidestr-agent` binary and what only it needs: argument parsing, an
# async runtime, relay delivery and HTTP to a producer or mirror. The library
# without it is pure (no network, no runtime) and builds for wasm32, so a
# browser wallet links the same builders an agent does:
# `sidestr-agent = { version = "0.3", default-features = false }`.
cli = ["dep:clap", "dep:tokio", "dep:ureq", "dep:sidestr-round", "sidestr-wallet/client"]

[dependencies]
sidestr-core = { path = "../sidestr-core", version = "0.3.1" }
sidestr-wallet = { path = "../sidestr-wallet", version = "0.4" }
sidestr-nostr = { path = "../sidestr-nostr", version = "0.3" }
sidestr-round = { path = "../sidestr-round", version = "0.2", features = ["relay"], optional = true }
bitcoin = { workspace = true }
bech32 = { workspace = true }
# The peg-in plan's descriptor, address and checksum: rust-bitcoin's own
# miniscript, never a hand-assembled taproot tree.
miniscript = { version = "12", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# HTTPS mirrors as well as a producer on loopback: ureq's rustls backend.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
